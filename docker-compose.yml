name: cageledger

services:
  cageledger:
    image: ddns.cellnucle.us:3333/hugo/cageledger:${CAGELEDGER_IMAGE_TAG:-latest}
    container_name: cageledger
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CAGELEDGER_ADMIN_USERNAME=admin
      - CAGELEDGER_ADMIN_PASSWORD=admin123
      - CAGELEDGER_REPOSITORY_URL=${CAGELEDGER_REPOSITORY_URL:-https://git.cellnucle.us/hugo/cageledger}
      - CAGELEDGER_BRANCH=${CAGELEDGER_BRANCH:-main}
      - CAGELEDGER_UPDATE_CHECK_ENABLED=${CAGELEDGER_UPDATE_CHECK_ENABLED:-false}
      - CAGELEDGER_GITEA_TOKEN=${CAGELEDGER_GITEA_TOKEN:-}
      - CAGELEDGER_LOG_PERSISTENCE_ENABLED=${CAGELEDGER_LOG_PERSISTENCE_ENABLED:-true}
      - CAGELEDGER_LOG_MAX_BYTES=${CAGELEDGER_LOG_MAX_BYTES:-10485760}
      - CAGELEDGER_LOG_FILE_COUNT=${CAGELEDGER_LOG_FILE_COUNT:-5}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_VISION_MODEL=${DEEPSEEK_VISION_MODEL:-deepseek-flash}
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        mode: non-blocking
        max-buffer-size: "1m"
