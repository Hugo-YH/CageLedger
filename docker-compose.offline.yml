name: cageledger

services:
  cageledger:
    build:
      context: .
      args:
        CAGELEDGER_APP_VERSION: ${CAGELEDGER_APP_VERSION:-local}
        CAGELEDGER_REVISION: ${CAGELEDGER_REVISION:-local}
    container_name: cageledger
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CAGELEDGER_ENV=production
      - CAGELEDGER_ADMIN_USERNAME=${CAGELEDGER_ADMIN_USERNAME:-admin}
      - CAGELEDGER_ADMIN_PASSWORD=${CAGELEDGER_ADMIN_PASSWORD:-}
      - CAGELEDGER_REPOSITORY_URL=${CAGELEDGER_REPOSITORY_URL:-https://git.cellnucle.us/hugo/cageledger}
      - CAGELEDGER_BRANCH=${CAGELEDGER_BRANCH:-main}
      - CAGELEDGER_UPDATE_CHECK_ENABLED=${CAGELEDGER_UPDATE_CHECK_ENABLED:-false}
      - CAGELEDGER_GITEA_TOKEN=${CAGELEDGER_GITEA_TOKEN:-}
      - CAGELEDGER_LOG_PERSISTENCE_ENABLED=${CAGELEDGER_LOG_PERSISTENCE_ENABLED:-true}
      - CAGELEDGER_LOG_MAX_BYTES=${CAGELEDGER_LOG_MAX_BYTES:-10485760}
      - CAGELEDGER_LOG_FILE_COUNT=${CAGELEDGER_LOG_FILE_COUNT:-365}
      - CAGELEDGER_LOG_RETENTION_DAYS=${CAGELEDGER_LOG_RETENTION_DAYS:-90}
      - CAGELEDGER_LOG_TOTAL_MAX_BYTES=${CAGELEDGER_LOG_TOTAL_MAX_BYTES:-1073741824}
      - CAGELEDGER_HTTP_MAX_WORKERS=${CAGELEDGER_HTTP_MAX_WORKERS:-32}
      - CAGELEDGER_HEAVY_MAX_WORKERS=${CAGELEDGER_HEAVY_MAX_WORKERS:-1}
      - CAGELEDGER_SQLITE_CACHE_KIB=${CAGELEDGER_SQLITE_CACHE_KIB:-80000}
      - CAGELEDGER_SQLITE_MMAP_BYTES=${CAGELEDGER_SQLITE_MMAP_BYTES:-268435456}
      - CAGELEDGER_PDF_MAX_PENDING=${CAGELEDGER_PDF_MAX_PENDING:-32}
      - CAGELEDGER_PDF_RENDER_MAX_PENDING=${CAGELEDGER_PDF_RENDER_MAX_PENDING:-32}
    volumes:
      - ./data:/app/data
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
        mode: non-blocking
        max-buffer-size: "1m"
