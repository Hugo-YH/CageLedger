<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="settlement-lifecycle-title settlement-lifecycle-desc">
<title id="settlement-lifecycle-title">流程阶段与归档状态</title><desc id="settlement-lifecycle-desc">已登记仍未归档；已发起和已登记都可按授权锁定。 1. 已生成 · 未归档：结算列表处理；2. 已发起 · 未归档：进入单据跟踪；3. 已登记 · 未归档：保存结算单交回登记；4. 撤回 / 撤销：按权限与原因逐级处理；5. 锁定 · 已归档：已发起或已登记均可锁定；6. 解锁 · 未归档：恢复锁定前阶段与资料。上排：生成 → 发起 → 登记。下排为独立操作说明；锁定授权与资金关联保护始终有效。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0958d9"/></marker></defs>
<rect width="984" height="528" rx="8" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, &quot;Noto Color Emoji&quot;">
<text x="32" y="48" fill="rgba(0,0,0,0.88)" font-size="26" font-weight="600">流程阶段与归档状态</text>
<text x="32" y="84" fill="rgba(0,0,0,0.65)" font-size="17">已登记仍未归档；已发起和已登记都可按授权锁定。</text>
<g fill="none" stroke="#0958d9" stroke-width="2" marker-end="url(#arrow)"><path d="M312 184H344 "/><path d="M632 184H664"/></g>
<g><rect x="32" y="132" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="52" y="166" fill="#0958d9" font-size="14" font-weight="600">01</text><text x="52" y="193" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">已生成 · 未归档</text><text x="52" y="218" fill="rgba(0,0,0,0.65)" font-size="16">结算列表处理</text></g>
<g><rect x="352" y="132" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="372" y="166" fill="#0958d9" font-size="14" font-weight="600">02</text><text x="372" y="193" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">已发起 · 未归档</text><text x="372" y="218" fill="rgba(0,0,0,0.65)" font-size="16">进入单据跟踪</text></g>
<g><rect x="672" y="132" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="692" y="166" fill="#0958d9" font-size="14" font-weight="600">03</text><text x="692" y="193" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">已登记 · 未归档</text><text x="692" y="218" fill="rgba(0,0,0,0.65)" font-size="16">保存结算单交回登记</text></g>
<g><rect x="32" y="308" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="52" y="342" fill="#0958d9" font-size="14" font-weight="600">04</text><text x="52" y="369" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">撤回 / 撤销</text><text x="52" y="394" fill="rgba(0,0,0,0.65)" font-size="16">按权限与原因逐级处理</text></g>
<g><rect x="352" y="308" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="372" y="342" fill="#0958d9" font-size="14" font-weight="600">05</text><text x="372" y="369" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">锁定 · 已归档</text><text x="372" y="394" fill="rgba(0,0,0,0.65)" font-size="16">已发起或已登记均可锁定</text></g>
<g><rect x="672" y="308" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="692" y="342" fill="#0958d9" font-size="14" font-weight="600">06</text><text x="692" y="369" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">解锁 · 未归档</text><text x="692" y="394" fill="rgba(0,0,0,0.65)" font-size="16">恢复锁定前阶段与资料</text></g>
<path d="M32 448H952" stroke="#f0f0f0"/><text x="32" y="478" fill="rgba(0,0,0,0.65)" font-size="15">上排：生成 → 发起 → 登记。下排为独立操作说明；锁定授权与资金关联保护始终有效。</text></g></svg>
