<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="quarantine-workflow-title quarantine-workflow-desc">
<title id="quarantine-workflow-title">检疫批次与报告版本</title><desc id="quarantine-workflow-desc">检测出具与整批完成分别确认，历史报告保留独立版本。 1. 待检疫来源：全部接收 / 手工来源；2. 建立检疫批次：冻结编号 · 保存覆盖范围；3. 检测与原始资料：寄生虫 · ELISA · PCR；4. 出具与异常处理：正式报告 · 分供应商复检；5. 人工确认完成：所需报告与最终结论齐备；6. 更正或复检：重新进入检疫中并再确认。检疫完成不改写接收状态；下载汇总草稿不推进批次或检测状态。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0958d9"/></marker></defs>
<rect width="984" height="528" rx="8" fill="#ffffff"/>
