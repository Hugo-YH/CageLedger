<g><rect x="672" y="308" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="692" y="342" fill="#0958d9" font-size="14" font-weight="600">04</text><text x="692" y="369" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">恢复到隔离目录</text><text x="692" y="394" fill="rgba(0,0,0,0.65)" font-size="16">不覆盖在线数据</text></g>
