<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="backup-restore-title backup-restore-desc">
<title id="backup-restore-title">备份与恢复演练</title><desc id="backup-restore-desc">先确认实际数据库路径；SQLite 备份和附件共同组成恢复材料。 1. 定位运行数据：DB 路径 · 附件 · 配置；2. 取得一致备份：按备份工具约束执行；3. 校验与异地保留：摘要 · 时间 · 版本；4. 恢复到隔离目录：不覆盖在线数据；5. 验证恢复结果：健康检查 · 记录 · 附件；6. 生产恢复：单独授权后安排切换。只复制正在写入的 SQLite 主文件不能代替一致备份；保留 WAL 相关边界。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0958d9"/></marker></defs>
<rect width="984" height="528" rx="8" fill="#ffffff"/>
<g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, &quot;Noto Sans&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;, &quot;Noto Color Emoji&quot;">
<text x="32" y="48" fill="rgba(0,0,0,0.88)" font-size="26" font-weight="600">备份与恢复演练</text>
<text x="32" y="84" fill="rgba(0,0,0,0.65)" font-size="17">先确认实际数据库路径；SQLite 备份和附件共同组成恢复材料。</text>
