<title id="business-journey-title">从动物接收到费用登记</title><desc id="business-journey-desc">接收、检疫、占用与计费分别记录；相邻业务不会自动代替人工确认。 1. 预约与笼卡：识别核对 · 保存 · 打印；2. 到货与独立接收：确认到货 · 实际登记；3. 检疫与入驻：检测确认 / 预留与占用；4. 日常巡检：异常 · 处置 · 复查；5. 费用来源：数量统计表 / 技术服务明细；6. 结算与单据跟踪：分别出单 · 登记 · 锁定。此图为业务阅读顺序；检疫不自动限制接收或入驻，笼位图不自动生成正式饲养费账单。</desc>
