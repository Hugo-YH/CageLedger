<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="release-delivery-title release-delivery-desc">
<title id="release-delivery-title">云端发布与交付</title><desc id="release-delivery-desc">日常提交与正式发布分开；每个阶段保留同一源码的证据。 1. 准备版本与说明：同步版本 · 更新日志；2. 验证与 ARM64 构建：相关验收 · 构建 · 冒烟；3. 推送代码与附注标签：来源与产物对应；4. Packages 核验：镜像身份 · 不可变摘要；5. 显式发表 Release：校验既有证据与产物；6. 后续显式操作：更新 latest / 授权部署。离线镜像需显式选择；Mac 本地发布为独立的手动备用路径。</desc>
