<text x="32" y="48" fill="rgba(0,0,0,0.88)" font-size="26" font-weight="600">一次业务写入的处理链</text>
<text x="32" y="84" fill="rgba(0,0,0,0.65)" font-size="17">页面不直接操作数据库；成功写入后仅刷新相关查询。</text>
