<g><rect x="672" y="308" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="692" y="342" fill="#0958d9" font-size="14" font-weight="600">04</text><text x="692" y="369" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">Repository / SQLite</text><text x="692" y="394" fill="rgba(0,0,0,0.65)" font-size="16">持久化与兼容数据处理</text></g>
