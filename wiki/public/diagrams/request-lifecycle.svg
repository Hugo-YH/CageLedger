<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="request-lifecycle-title request-lifecycle-desc">
<title id="request-lifecycle-title">一次业务写入的处理链</title><desc id="request-lifecycle-desc">页面不直接操作数据库；成功写入后仅刷新相关查询。 1. View 与 typed hook：收集输入与局部草稿；2. API client / handler：请求契约 · 鉴权 · 响应；3. 领域 service：业务校验 · 事务边界；4. Repository / SQLite：持久化与兼容数据处理；5. 审计与缓存：记录操作 · 刷新领域缓存；6. Query 与界面：失效相关查询 · 展示结果。失败时保留可恢复输入；并发冲突需重新核对，不能静默覆盖。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0958d9"/></marker></defs>
<rect width="984" height="528" rx="8" fill="#ffffff"/>
