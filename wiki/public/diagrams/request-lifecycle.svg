<g><rect x="32" y="132" width="280" height="104" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="52" y="166" fill="#0958d9" font-size="14" font-weight="600">01</text><text x="52" y="193" fill="rgba(0,0,0,0.88)" font-size="21" font-weight="600">View 与 typed hook</text><text x="52" y="218" fill="rgba(0,0,0,0.65)" font-size="16">收集输入与局部草稿</text></g>
