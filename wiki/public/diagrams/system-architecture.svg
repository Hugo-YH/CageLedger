<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
<title id="system-architecture-title">系统结构与数据边界</title><desc id="system-architecture-desc">业务数据由 Python API 读写；文档站独立构建，共用视觉 Token。 1. 浏览器工作台：React · Ant Design · Query；2. HTTP 与鉴权：Python 标准库服务；3. 领域服务：校验 · 权限 · 事务 · 审计；4. 业务导出：PDF · Excel · 冻结快照；5. Repository：SQL 与兼容读写；6. 持久存储：SQLite + 附件目录。VitePress 文档站 → /docs/；生产工作台与 /api 由同一服务提供。</desc>
