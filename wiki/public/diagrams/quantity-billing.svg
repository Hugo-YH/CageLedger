<svg xmlns="http://www.w3.org/2000/svg" width="984" height="528" viewBox="0 0 984 528" role="img" aria-labelledby="quantity-billing-title quantity-billing-desc">
<title id="quantity-billing-title">数量统计表到月度饲养费</title><desc id="quantity-billing-desc">正式核算以数量统计表为来源，按项目负责人逐日计算。 1. 读取每日实际数量：月份 · 房间 · IACUC；2. 区分收费范围：自定义部分独立计费；3. 判断减免资格：计费日期内的 IACUC 有效期；4. 分配 PI 每日额度：全免 · 固定优先 · 余量分配；5. 计算标准与梯度费用：自定义部分不参与累计；6. 汇总与冻结版本：按月 / PI 出单 · 发起时冻结。本图概括核算步骤；设施、物种、计费单位与适用减免规则详见正文。</desc>
